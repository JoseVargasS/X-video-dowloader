<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>X Video Downloader</title>
    <link rel="icon" type="image/svg+xml" href="/web/favicon.svg" />
    <link rel="stylesheet" href="/web/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="topbar" aria-label="Descargador">
        <div>
          <p class="eyebrow"><img src="/web/favicon.svg" alt="" /> X Video Downloader</p>
          <h1>Descarga videos de X</h1>
        </div>
        <div class="status-pill" id="appStatus">Listo</div>
      </section>

      <form class="url-row" id="linkForm">
        <input
          id="urlInput"
          type="url"
          autocomplete="off"
          spellcheck="false"
          placeholder="Pega aqui el enlace de X"
          required
        />
        <button type="button" id="pasteButton">Pegar</button>
        <button type="submit" id="loadButton">Cargar</button>
      </form>

      <section class="workspace" id="workspace" hidden>
        <div class="collection-head">
          <div>
            <h2 id="videoTitle"></h2>
            <span id="durationLabel"></span>
          </div>
          <div class="collection-actions">
            <button type="button" id="selectAllButton">Seleccionar todos</button>
            <button type="button" id="downloadSelectedButton">Descargar seleccionados</button>
          </div>
        </div>

        <div class="video-list" id="videoList"></div>
      </section>

      <p class="message" id="message" role="status"></p>
      <iframe id="downloadFrame" name="downloadFrame" title="Descarga" hidden></iframe>
    </main>
    <script src="/web/app.js"></script>
  </body>
</html>
