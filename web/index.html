<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>X Video Downloader</title>
    <link rel="stylesheet" href="/web/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="topbar" aria-label="Descargador">
        <div>
          <p class="eyebrow">X Video Downloader</p>
          <h1>Descarga videos de X</h1>
        </div>
        <div class="status-pill" id="appStatus">Listo</div>
      </section>

      <form class="url-row" id="linkForm">
        <input
          id="urlInput"
          type="url"
          autocomplete="off"
          spellcheck="false"
          placeholder="Pega aqui el enlace de X"
          required
        />
        <button type="button" id="pasteButton">Pegar</button>
        <button type="submit" id="loadButton">Cargar</button>
      </form>

      <section class="workspace" id="workspace" hidden>
        <div class="preview-panel">
          <div class="video-stage" id="videoStage">
            <img id="thumbnail" alt="" hidden />
            <video id="videoPlayer" playsinline hidden></video>
            <div class="loader" id="previewLoader">Preparando vista previa...</div>
            <div class="custom-controls" id="customControls" hidden>
              <button type="button" id="playPauseButton" aria-label="Reproducir">Play</button>
              <input type="range" id="seekSlider" min="0" max="1000" value="0" aria-label="Progreso" />
              <span id="timeReadout">0:00 / 0:00</span>
              <button type="button" id="muteButton" aria-label="Silenciar">Vol</button>
              <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1" aria-label="Volumen" />
            </div>
          </div>
          <div class="video-meta">
            <h2 id="videoTitle"></h2>
            <span id="durationLabel"></span>
          </div>
        </div>

        <form class="download-panel" id="downloadForm" method="post" action="/download" target="downloadFrame">
          <input type="hidden" name="token" id="tokenInput" />

          <label class="field-label" for="qualitySelect">Calidad</label>
          <select id="qualitySelect" name="format"></select>

          <div class="range-head">
            <span>Rango</span>
            <button type="button" id="fullButton">Todo el video</button>
          </div>

          <div class="time-grid">
            <label>
              <span>Desde</span>
              <input id="startInput" name="start" type="text" inputmode="numeric" placeholder="0:00" />
            </label>
            <label>
              <span>Hasta</span>
              <input id="endInput" name="end" type="text" inputmode="numeric" placeholder="final" />
            </label>
          </div>

          <p class="hint" id="trimHint">Dejalo vacio para descargar el video completo.</p>

          <button class="download-button" id="downloadButton" type="submit">Descargar</button>
        </form>
      </section>

      <p class="message" id="message" role="status"></p>
      <iframe name="downloadFrame" title="Descarga" hidden></iframe>
    </main>
    <script src="/web/app.js"></script>
  </body>
</html>
